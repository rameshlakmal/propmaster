name: propmaster

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: propmaster
      POSTGRES_PASSWORD: propmaster
      POSTGRES_DB: qa_shop
    ports:
      - "5433:5432"
    volumes:
      - ./docker/00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
      - ./demo/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./demo/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # TCP, not the socket: the temporary server that runs the init scripts is socket-only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U propmaster -d qa_shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The whole demo in one command, with only Docker installed: docker compose run --rm demo
  demo:
    image: node:24-slim
    profiles: [demo]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    environment:
      PROPMASTER_DATABASE_URL: postgres://propmaster:propmaster@postgres:5432/qa_shop
    volumes:
      - .:/app
      - demo_node_modules:/app/node_modules  # Linux packages, kept apart from the host's node_modules
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npx tsx scripts/demo.ts"

volumes:
  demo_node_modules:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Postgres ${{ matrix.postgres }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [13, 14, 15, 16, 17]
        node: [24]
        include:
          - postgres: 17
            node: 22.12   # the oldest Node version Propmaster supports

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: propmaster
          POSTGRES_PASSWORD: propmaster
          POSTGRES_DB: propmaster_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U propmaster -d propmaster_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      PROPMASTER_TEST_DATABASE_URL: postgres://propmaster:propmaster@localhost:5433/propmaster_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --url "$PROPMASTER_TEST_DATABASE_URL" doctor
          node dist/cli.js find --recipes demo/recipes
